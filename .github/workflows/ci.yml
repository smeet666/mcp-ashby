name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Five identical runs: a suite that passes once passed once.
      - run: for i in 1 2 3 4 5; do npm test || exit 1; done
      - run: npm run build
