name: Publish to npm

on:
  # A tag pushed by a person starts this. A release cut by a workflow starts
  # nothing, because GitHub refuses to let one workflow trigger another through
  # the token it lends them.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The npm that mints the OIDC token needs a newer Node than the one
          # this package requires of its users.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs a recent npm CLI, newer than the one Node 20
      # carries, and it is what mints the OIDC token.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      # Trusted publishing: the repository's own identity, with no stored token.
      - run: npm publish --provenance --access public
