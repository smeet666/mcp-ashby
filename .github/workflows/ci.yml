name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A formatting or lint verdict does not depend on the version of node. In
      # the matrix the same complaint would be reported twice, labelled with a
      # version that has nothing to do with it. No `needs` either: a formatting
      # nit must never hide a failing test, so both jobs start at once.
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Five identical runs: a suite that passes once passed once.
      - run: for i in 1 2 3 4 5; do npm test || exit 1; done
      - run: npm run build
